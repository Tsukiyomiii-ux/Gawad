name: tanod_incentives
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # PDF generation & preview
  pdf: ^3.11.1
  printing: ^5.13.2

  # Scanners & camera
  mobile_scanner: ^5.2.3
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  image: ^4.2.0                  # straightening the ID card photo
  google_generative_ai: ^0.4.6   # Gemini reading in the OCR scanner

  # Uploading signed copies
  file_selector: ^1.1.0

  # UI icons
  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/iloilo.jpg
    - assets/logo.png